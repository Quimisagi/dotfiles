[pyprland]
plugins = ["scratchpads", "layout_center"]

[scratchpads.term]
animation = "fromTop"
command = "kitty --class scratchpad"
class = "scratchpad"
size = "75% 60%"
unfocus = "hide"
lazy = "true"
allow_special_workspaces = true


# [scratchpads.browser]
# animation = "fromTop"
# command = "min"
# class = "Min"
# size = "80% 70%"
# unfocus = "hide"


[layout_center]
margin = 50
offset = [0, 30]
next = "movefocus r"
prev = "movefocus l"
next2 = "movefocus d"
prev2 = "movefocus u"

