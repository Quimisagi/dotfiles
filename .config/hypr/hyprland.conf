
plugin {
    split-monitor-workspaces {
        count = 5
        keep_focused = 0
        enable_persistent_workspaces = 1

        # set this to 1 for gnome-like workspace switching
        link_monitors = 0

        # if you want a different monitor order
        monitor_priority = HDMI-A-1, eDP-1

        link_monitors = 1

        max_workspaces = HDMI-A-1, 5
        max_workspaces = eDP-1, 5
    }
    hyprexpo {
        columns = 2
        gap_size = 10
        bg_col = rgb(111111)
        workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1

        gesture_distance = 300 # how far is the "max" for the gesture
    }
}


################
### MONITORS ###
################

monitor = HDMI-A-1, 1920x1080@60, 0x0, 1

### Lid Handling

bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 1920x1080@60, 1920x0, 1"


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = kitty -e lf
$menu = walker
$browser = brave-origin-nightly


#################
### AUTOSTART ###
#################

exec-once = quickshell
exec-once = qs -p ~/.local/share/quickshell-lockscreen/lock_shell.qml
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start elephant
exec-once=walker --gapplication-service
exec-once = pypr
exec-once = wayle panel start
exec-once = awww-daemon
exec-once = hyprpm reload -n
# exec-once = nwg-dock-hyprland -i 24 -mb 2 -nolauncher -d
exec-once = systemctl --user restart xdg-desktop-portal ; systemctl --user restart xdg-desktop-portal-hyprland
exec-once = sleep 3 && kando
exec-once = discord --start-minimized
# exec-once = hypridle

exec = ~/.config/hypr/scripts/check_lid.sh
exec = hyprpaper

### ENVIRONMENT VARIABLES ###
#############################


env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 2.5
    gaps_out = 5

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 20
    rounding_power = 4

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.5

    shadow {
        enabled = true
        range = 10
        render_power = 5
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 2

        vibrancy = 0.1696
    }
}

general {
    # Set the thickness of the border in pixels
}
# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = true

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.2, 1,    0.32, 1
    bezier = easeInOutCubic, 0.6, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.1, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     3.5,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     7,  default,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    enable_swallow = true  # Add this
    swallow_regex = ^(Alacritty|kitty|foot)$  # Terminal to swallow
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/new-kitty-cwd.sh
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, X, exec, echo "open" | nc -U /run/user/1000/walker/walker.sock
bind = $mainMod, B, exec, $browser
bind = $mainMod, A, exec, pypr toggle term
bind = $mainMod, T, exec, pypr toggle browser
bind = $mainMod, S, exec, pypr layout_center toggle
bind = $mainMod SHIFT, S, exec, pypr layout_center next # Cycle to next window
bind = $mainMod, V, exec, togglefloating
bind = $mainMod, F, exec, fullscreen

bind = $mainMod, F1, exec, pypr toggle line
bind = $mainMod, F2, exec, discord


bind = $mainMod, mouse:274, global, menu.kando.Kando:main-menu
bind = , mouse:274, exec, ~/.config/hypr/scripts/kando-toggle.sh
bind = $mainMod, Z, hyprexpo:expo, toggle
bind = , Print, exec, hyprshot -m region

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9
bind = $mainMod, 0, split-workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, split-movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, split-movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, split-movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, split-movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, split-movetoworkspacesilent, 10

# Cycle workspaces
bind = $mainMod SHIFT, right, split-cycleworkspaces, +1
bind = $mainMod SHIFT, left, split-cycleworkspaces, -1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindowmouse:274bind

# bindr = $mainMod, SUPER_L, exec, nwg-dock-hyprland

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+bind = $mainMod, mouse:274, resizeparams, reset
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mcenterwindowute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
# bindl = , XF86AudioPause,centerwindow exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = float-dialogs
    match:class = .*
    match:title = .*(Open|Save|Save As|Preferences|Settings).*
    float = true
    center = true
}

windowrule {
    name = hyprshot
    match:title = Hyprshot
    float = yes
    center = true
}

windowrule {
    name = obs
    match:class = com.obsproject.Studio
    float = yes
    center = true
}


windowrule {
  name = kando
  match:class = menu.kando.Kando
  match:title = Kando Menu
  no_blur = on
  opaque = on
  move = 0 0
  rounding = 0
  size = 100% 100%
  border_size = 0
  no_anim = on
  float = on
  pin = on
  fullscreen = on
}

windowrule {
  name = discord
  match:class = discord
  float = yes
  center = true
  size = 80% 90%
}


