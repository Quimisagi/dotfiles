# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################


# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

plugin {
    split-monitor-workspaces {
        count = 5
        keep_focused = 0
        enable_persistent_workspaces = 1

        # set this to 1 for gnome-like workspace switching
        link_monitors = 0

        # if you want a different monitor order
        monitor_priority = HDMI-A-1, eDP-1

        link_monitors = 1

        max_workspaces = HDMI-A-1, 5
        max_workspaces = eDP-1, 5
    }
}


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
# monitor = eDP-1, disable
# monitor = eDP-1, disable
# # Trigger when the lid is opened
# bindl=,switch:on:Lid Status,exec,hyprctl keyword monitor "eDP-1, 1920x1080@60, 1920x0, 1"

# # Trigger when the lid is closed
# bindl=,switch:off:Lid Status,exec,hyprctl keyword monitor "eDP-1, disable"


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = kitty -e lf
$menu = walker
$browser = brave


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = quickshell
exec-once = elephant
exec-once=walker --gapplication-service
exec-once = pypr
exec-once = hyprpanel
exec-once = qs -p ~/.local/share/quickshell-lockscreen/lock_shell.qml
exec-once = swww-daemon
exec-once = hyprpaper
exec-once = hyprpm reload -n


# Run the portal reset script
exec-once = ~/.config/hypr/scripts/portal.sh
exec-once = kando

exec-once = nwg-dock-hyprland -nolauncher -i 48 -w 5 -mb 10 -ml 10 -mr 10 -c "pkill -f nwg-dock-hyprland" -p bottom -a center -f -hd 0

### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
